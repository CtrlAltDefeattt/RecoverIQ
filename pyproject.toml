[project]
name = "recoveriq-api"
version = "0.1.0"
description = "Safety-constrained adaptive revenue recovery API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "numpy==2.3.2",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",
    "psycopg[binary]==3.3.4",
    "uvicorn[standard]==0.35.0",
]

[tool.vercel]
entrypoint = "main:app"
