[project]
name = "recoveriq-api"
version = "0.1.0"
description = "Safety-constrained adaptive revenue recovery API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "numpy==2.3.2",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",
    "psycopg[binary]==3.3.4",
    "uvicorn[standard]==0.35.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["frontend", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
