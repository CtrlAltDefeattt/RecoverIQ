name: RecoverIQ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic smoke benchmark
        run: python -m experiments.run_benchmark --events 1000 --seed 42

      - name: Run paired multi-seed evaluation smoke test
        run: >-
          python -m experiments.run_multiseed --events 100 --seeds 3 --workers 2
          --output /tmp/recoveriq_ci_multiseed.json

      - name: Run bounded journey and budget smoke test
        run: >-
          python -m experiments.run_day5_scenarios --journey-cases 50
          --batch-cases 25 --seed 42 --budget-paise 2000 --max-actions 5
          --output /tmp/recoveriq_ci_day5.json

      - name: Run persistence Safety Gauntlet
        run: >-
          python -m experiments.run_day6_safety_gauntlet
          --output /tmp/recoveriq_ci_day6.json

      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint dashboard
        working-directory: frontend
        run: npm run lint

      - name: Test dashboard
        working-directory: frontend
        run: npm test
