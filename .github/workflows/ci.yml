name: RecoverIQ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic smoke benchmark
        run: python -m experiments.run_benchmark --events 1000 --seed 42

      - name: Run paired multi-seed evaluation smoke test
        run: >-
          python -m experiments.run_multiseed --events 100 --seeds 3
          --output /tmp/recoveriq_ci_multiseed.json
